/* The navigation is not an always-visible sidebar. Only the small orbital launcher remains. */
.orbital-nav{position:fixed;bottom:24px;left:26px;z-index:80;display:flex;align-items:center;justify-content:center;width:62px;height:62px}
.orb-launch{border:1px solid #779ab5a1;width:62px;height:62px;border-radius:21px;background:linear-gradient(150deg,#233b50ed,#101f30f6);backdrop-filter:blur(20px);color:#c6e7fb;display:grid;place-items:center;box-shadow:0 14px 44px #0008,0 0 35px #72bdf21c;position:relative;z-index:3;transition:transform .35s,background .35s,border-color .35s}
.orb-logo{display:grid;place-items:center;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.orb-launch:before{content:'';position:absolute;inset:-6px;border:1px solid #729bc14b;border-radius:27px;pointer-events:none;animation:orbit-glow 4s ease-in-out infinite}
@keyframes orbit-glow{50%{opacity:.45;transform:scale(1.045)}}
.orb-launch:hover{transform:translateY(-3px);border-color:#b7ddf2;background:#264c66}
.orb-launch:hover .orb-logo,.orbital-nav.expanded .orb-logo{transform:rotate(135deg)}
.orb-menu{position:absolute;left:1px;bottom:79px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 8px;background:#122439ee;border:1px solid #35516be0;backdrop-filter:blur(22px);border-radius:28px;box-shadow:0 18px 65px #0009;opacity:0;transform:translateY(17px) scale(.94);pointer-events:none;visibility:hidden;transition:opacity .34s,transform .42s cubic-bezier(.16,1,.3,1),visibility .34s}
.orbital-nav.expanded .orb-menu{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;visibility:visible}
.orb-link{position:relative;display:grid;place-items:center;width:47px;height:47px;background:transparent;color:#93aabd;border-radius:17px;transition:background .25s,color .25s,transform .3s;opacity:0;transform:translateY(14px) scale(.9)}
.orbital-nav.expanded .orb-link{animation:orb-stagger .42s cubic-bezier(.2,1,.2,1) both;animation-delay:calc(var(--item)*45ms)}
@keyframes orb-stagger{to{opacity:1;transform:translateY(0) scale(1)}}
.orb-link:hover,.orb-link:focus-visible{color:#0c1b2a;background:#b9ddf1;transform:translateX(4px)}
.orb-link.active{background:#385976;color:#dbf0ff}
.orb-link.active:after{content:'';position:absolute;width:4px;height:4px;right:1px;top:2px;border-radius:50%;background:#ff9e91}
.orb-tooltip{position:absolute;left:60px;white-space:nowrap;font-size:11px;font-weight:800;color:#091521;background:#d9e9f3;border-radius:8px;padding:8px 10px;pointer-events:none;opacity:0;transform:translateX(-5px);transition:.2s}
.orb-link:hover .orb-tooltip,.orb-link:focus-visible .orb-tooltip{opacity:1;transform:translateX(0)}
/* Immersive page transitions: distinct motion per destination. */
.travel-veil{position:fixed;inset:0;z-index:150;background:#060d17;display:grid;place-items:center;opacity:0;pointer-events:none;transform:scale(1.04);transition:opacity .28s,transform .38s;overflow:hidden}
.travel-veil.shown{opacity:1;transform:scale(1);pointer-events:auto}
.travel-veil.leaving{opacity:0;transform:scale(1.06)}
.travel-veil:before{content:'';position:absolute;width:44vmax;height:44vmax;border-radius:50%;background:radial-gradient(circle,#31658f50,transparent 70%);filter:blur(55px)}
.travel-emblem{position:relative;width:176px;height:176px;display:grid;place-items:center;color:#c5e7fb}
.travel-orbit{position:relative;z-index:2;display:grid;place-items:center;width:90px;height:90px;border-radius:32px;background:#1e3851;border:1px solid #6fa1c5;box-shadow:0 0 55px #72b3ea33;animation:travel-beat .7s ease-in-out infinite alternate}
.travel-ring{position:absolute;inset:0;border:1px solid #81b4d488;border-radius:50%;animation:travel-spin 2s linear infinite}
.travel-ring:after{content:'';position:absolute;top:12px;left:24px;width:11px;height:11px;border-radius:50%;background:#ffad9e;box-shadow:0 0 24px #ff9c88}
.ring-b{inset:18px;border-color:#789ab388;animation-direction:reverse;animation-duration:1.4s;transform:rotate(45deg)}
.ring-c{inset:-24px;border-style:dashed;border-color:#b8ddf14a;animation-duration:5s}
@keyframes travel-spin{to{transform:rotate(360deg)}}@keyframes travel-beat{to{transform:scale(.92);border-radius:50%}}
.travel-overview .travel-orbit{animation:overview-flip .7s ease-in-out infinite alternate;background:#a6d1eb;color:#13283b}
@keyframes overview-flip{to{transform:rotateY(180deg) scale(.85);border-radius:50%}}
.travel-planner .travel-emblem{animation:planner-pendulum .75s ease-in-out infinite alternate}
@keyframes planner-pendulum{to{transform:rotate(15deg) translateY(-12px)}}
.travel-insights .travel-bars{display:flex}
.travel-bars{display:none;align-items:end;gap:7px;position:absolute;top:calc(50% + 104px)}
.travel-bars i{width:6px;height:14px;background:#a3d0eb;border-radius:3px;animation:bar-race .7s ease-in-out infinite alternate}
.travel-bars i:nth-child(2){animation-delay:.12s;background:#ffab9c}.travel-bars i:nth-child(3){animation-delay:.26s}.travel-bars i:nth-child(4){animation-delay:.4s;background:#ffab9c}.travel-bars i:nth-child(5){animation-delay:.54s}
@keyframes bar-race{to{height:42px}}
.travel-routines .travel-ring{border-style:dotted;border-width:3px}.travel-reviews .travel-orbit{animation:review-pop .6s ease-in-out infinite alternate}
@keyframes review-pop{to{transform:scale(1.2) rotate(-12deg);background:#3d6c70}}
.travel-settings .travel-orbit{animation:travel-spin 1.5s linear infinite}.travel-home .travel-ring{animation-duration:1s}
/* HOME — editorial-scale greeting, sculptural orbit, and measured performance. */
.home-scene{position:relative;max-width:1370px;margin:auto;padding:0 0 30px}

.home-content{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(320px,.76fr);gap:34px;margin-top:33px}

.home-trend-head{display:flex;align-items:start;justify-content:space-between;gap:10px}.home-trend-head h3{margin:9px 0 0;font-family:Manrope;font-size:22px;letter-spacing:-.8px}.trend-link{background:transparent;color:#bedcf1;display:flex;align-items:center;gap:9px;font-size:11px;font-weight:800;white-space:nowrap}

.reflection-top{display:flex;align-items:center;gap:13px}.reflection-sigil{width:38px;height:38px;border:1px solid #9a73806d;border-radius:12px;display:grid;place-items:center;color:#ffb5a7;background:#ffb4a611}

/* ORBIT / CHANGE 02 — MIDNIGHT BLACK × ELECTRIC BLUE × CANTALOUPE ORANGE
   Inspired by the user's FluxEdit reference: near-black canvases, an electric
   blue glow that blooms into a restrained cantaloupe horizon, and quiet cards.
   This layer deliberately keeps all existing behavior, layout and animations. */
:root{
  --bg:#02070A;--surface:#07121B;--surface2:#0B1A25;--surface3:#102532;
  --line:#204054;--text:#F4F8FC;--muted:#9CB1BE;--dim:#718D9D;
  --lime:#0297DE;--lime-soft:#092F45;--amber:#FC734D;--red:#FF826B;
  --midnight:#02070A;--electric:#0297DE;--cantaloupe:#FC734D;
  --shadow:0 28px 80px #000a;
}
html{background:var(--midnight)}
body{background:var(--midnight);color:var(--text)}
.app{
  background:
    radial-gradient(ellipse 37% 24% at 69% 3%,#0297DE19,transparent 90%),
    radial-gradient(ellipse 50% 21% at 83% 91%,#FC734D0d,transparent 90%),
    var(--midnight);
}
.main{position:relative}
.page{position:relative}
.panel{background:linear-gradient(155deg,#0B1C28 0%,#07121A 70%,#061019 100%);border-color:#193648}
.panel:hover{border-color:#2F5C73}
.eyebrow,.small-overline{color:#70C9F5}
.btn-primary,.home-cta{background:var(--electric);color:#fff;box-shadow:0 9px 31px #0297DE36}
.btn-primary:hover,.home-cta:hover{background:#19B1FF;box-shadow:0 12px 43px #0297DE63}
.btn-soft,.btn-ghost{background:#0B2434;border:1px solid #26506B;color:#D8F0FF}
.btn-soft:hover,.btn-ghost:hover{border-color:var(--electric);background:#103249}
.icon-button{background:#0C2432;border:1px solid #2C5267;color:#BBD8E9}
.icon-button:hover{border-color:var(--electric);color:#fff}
.mini-badge{background:#072B40;color:#65C9FF;border-color:#155376}
.progress-track{background:#142E3F}
.progress-fill{background:linear-gradient(90deg,var(--electric),#4CC7FF)}
.check-input{background:#061520;border-color:#4B7185}
.check-input:hover{border-color:var(--electric)}
.check-input:checked{background:var(--electric);border-color:var(--electric);box-shadow:0 0 15px #0297DE4d}
.check-input:checked:after{color:#fff}
.task{background:#0C1B27;border-color:#20394A}
.task:hover{background:#102638;border-color:#2978A0}
.task.checked .task-name{text-decoration-color:#3887AA}
.cat-tag{background:#122E42;color:#B0D1E5}
.task-actions button:hover{background:#10364c;color:#C7EFFF}
.progress-track{background:#1a3446}
.bar-fill{background:linear-gradient(0deg,#026AAB,var(--electric) 75%,#57CCFF);box-shadow:0 0 18px #0297DE34}
.bar-col.active .bar-track{box-shadow:0 0 0 1px #4CB1E2}
.calendar-cell.perfect{background:#0297DE;color:#FFFFFF}
.calendar-cell.good{background:#1472A9;color:#F4FAFF}
.calendar-cell.medium{background:#A94C3B;color:#FFF7F2}

.calendar-cell.today{outline-color:var(--cantaloupe)}
.day-pill.selected,.weekday-picker label:has(input:checked){background:#0F3952;border-color:var(--electric);color:#EDF9FF}
.day-pill.selected strong{color:#4DC5FF}
.review-panel{background:linear-gradient(115deg,#0E2C41,#071924);border-color:#236388}
.review-symbol,.routine-icon,.empty-icon{background:#103850;color:#60C9FF}
.review-buttons button{background:#123750;color:#DCF3FF}
.review-buttons button.dismiss{background:#442218;color:#FFAB92}
.field input:focus,.field select:focus{border-color:var(--electric)}
.toast{background:var(--electric);color:white}
.insight-card,.routine-item,.setting-box{background:linear-gradient(150deg,#0D2230,#071821);border-color:#224456}
.routine-action{background:#0E2C3D;border-color:#2C5C74}
.routine-action:hover{border-color:var(--electric);color:#D4F3FF}
.review-item{background:#0D2332;border-color:#2A4D62}

/* Home: editorial typography laid over the luminous FluxEdit-like atmosphere. */
.home-scene{isolation:isolate}

.home-hero{isolation:isolate;border-color:#1A3F53;overflow:clip}
.home-hero:before{
  content:'';position:absolute;inset:-24px -4vw 0 21%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(ellipse 39% 55% at 66% 50%,#0297DE4C,transparent 84%),
    radial-gradient(ellipse 46% 32% at 70% 101%,#FC734D4A,transparent 85%),
    radial-gradient(ellipse 33% 44% at 51% 75%,#00669A35,transparent 86%);

  mask-image:linear-gradient(to bottom,transparent 1%,black 22%,black 87%,transparent 100%);

  content:'';position:absolute;right:-1%;bottom:9%;width:50%;height:57%;z-index:-1;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 8px,#0297DE23 9px 10px,transparent 11px 16px);

  content:'';position:absolute;bottom:-8%;width:76%;height:45%;border-radius:50%;z-index:-1;

.halo{border-color:#0297DE59}

 .home-hero:before,.home-hero:after,.home-art:before,.home-art:after{animation:none!important}

/* ORBIT / CHANGE 03 — MOTION SYSTEM & INTERACTIVE DEPTH
   The core palette intentionally remains #02070A, #0297DE, #FC734D.
   Compositor-only movement, CSS 3D without WebGL, local data, reduced-motion access. */
:root{--ease-out:cubic-bezier(.16,1,.3,1);--ease-spring:cubic-bezier(.2,1.35,.35,1)}
.app{position:relative;isolation:isolate}
.app:before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(560px circle at var(--pointer-x,-1000px) var(--pointer-y,-1000px),rgba(2,151,222,.045),transparent 75%);mix-blend-mode:screen}
.app>.main{z-index:1}
.page{animation:scene-appear .66s var(--ease-out) both}
@keyframes scene-appear{from{opacity:0;transform:translateY(16px) scale(.995);filter:blur(5px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
/* Floating quick access, restrained and never a permanent toolbar. */
.quick-command{position:fixed;z-index:81;bottom:32px;left:100px;width:43px;height:43px;display:grid;place-items:center;background:#071b29ec;border:1px solid #286181;border-radius:15px;color:#b5eaff;box-shadow:0 8px 34px #0009,0 0 20px #0297DE10;backdrop-filter:blur(12px);transition:transform .25s var(--ease-spring),border-color .2s,box-shadow .25s}
.quick-command:hover,.quick-command:focus-visible{transform:translateY(-4px) rotate(7deg);border-color:#41cbff;box-shadow:0 12px 35px #0297DE35}
/* Accessible command palette */
.command-scrim{position:fixed;inset:0;z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:clamp(60px,14vh,140px) 16px 16px;background:rgba(1,4,7,.77);backdrop-filter:blur(15px);animation:scrim-in .22s ease-out both}
@keyframes scrim-in{from{opacity:0}to{opacity:1}}
.command-dialog{width:min(610px,100%);max-height:min(590px,75vh);display:flex;flex-direction:column;background:linear-gradient(145deg,#102b3c 0%,#071622 55%,#10141b 100%);border:1px solid #3a667f;border-radius:25px;overflow:hidden;box-shadow:0 42px 130px #000f,0 0 85px #0297DE1b;animation:dialog-in .36s var(--ease-out) both}
@keyframes dialog-in{from{opacity:0;transform:translateY(-18px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.command-search{display:flex;align-items:center;gap:15px;padding:22px 22px 20px;border-bottom:1px solid #234152;color:#74cfff}
.command-search input{flex:1;min-width:0;background:transparent;outline:0!important;border:0;font-size:17px;color:#fff;font-weight:600}
.command-search input::placeholder{color:#728d9f}.command-search input::-webkit-search-cancel-button{display:none}
.command-search kbd{font-size:10px;letter-spacing:1px;font-weight:800;color:#b5d1dc;border:1px solid #325266;background:#112e3b;padding:6px 8px;border-radius:7px}
.command-group{font-size:10px;letter-spacing:2px;font-weight:900;color:#7ab9d5;padding:19px 22px 10px}
.command-results{overflow-y:auto;padding:2px 9px 16px;scrollbar-color:#2c5973 transparent}
.command-item{display:flex;align-items:center;width:100%;gap:13px;text-align:left;background:transparent;color:#d7e8ef;border:1px solid transparent;border-radius:13px;padding:12px 14px;transition:background .16s,transform .16s,border-color .16s}
.command-item.is-selected,.command-item:hover,.command-item:focus-visible{background:#10415b;border-color:#2d799e;transform:translateX(3px)}
.command-item>svg:last-child{margin-left:auto;color:#61c7fc;opacity:.8}
.command-item-icon{width:38px;height:38px;display:grid;place-items:center;background:#0e3148;border:1px solid #2b5c76;border-radius:11px;color:#64caff}
.command-item-label{display:grid;gap:3px;flex:1}.command-item-label strong{font-size:13px}.command-item-label small{font-size:11px;color:#8eb0c1}
.command-empty{padding:23px;color:#9db2c0;text-align:center}.command-bottom{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #263e4f;padding:13px 22px;font-size:10px;color:#7fa6b9;letter-spacing:.6px}
/* Orb: physical depth built from layered, GPU-friendly CSS planes. */

}

function updateCinema(){

 scene.style.setProperty('--scene-copy-shift',(reduced?0:-Math.round(heroProgress*29))+'px');
 scene.style.setProperty('--scene-orb-shift',(reduced?0:-Math.round(heroProgress*66))+'px');
 scene.style.setProperty('--scene-orb-scale',String(reduced?1:(1-heroProgress*.11).toFixed(3)));
 scene.style.setProperty('--ambient-pan',(reduced?0:Math.round(traveled*86))+'px');

 if(!surface||event.target.closest('button,input,select,a'))return;
 const rect=surface.getBoundingClientRect(),ripple=document.createElement('i');
 ripple.className='cinema-tap-ripple';ripple.setAttribute('aria-hidden','true');
 ripple.style.setProperty('--tap-x',(event.clientX-rect.left)+'px');
 ripple.style.setProperty('--tap-y',(event.clientY-rect.top)+'px');
 surface.appendChild(ripple);setTimeout(()=>ripple.remove(),730);
},{passive:true});

// When the date changes while the tab stays open, generate the new day's tasks and refresh.
setInterval(()=>{if(window.__orbitRenderedDate!==today()){window.__orbitRenderedDate=today();selectedDate=today();render()}},15000);
window.__orbitRenderedDate=today();
setInterval(()=>{if(currentPage==='home'&&!modal&&!navigating&&!prefersLessMotion()&&!document.hidden){quoteIndex=(quoteIndex+1)%reflections.length;const body=document.getElementById('reflection-body'),q=reflections[quoteIndex];if(body){body.classList.add('quote-out');setTimeout(()=>{const live=document.getElementById('reflection-body');if(!live)return;live.innerHTML=`<div class="reflection-label">${E(q.label)}</div><blockquote>“${E(q.words)}”</blockquote><div class="reflection-by">${E(q.by)}</div>`;live.classList.remove('quote-out');const kind=document.getElementById('quote-kind');if(kind)kind.textContent=q.theme;const counter=document.querySelector('.reflection-counter');if(counter)counter.innerHTML=`${String((quoteIndex%reflections.length)+1).padStart(2,'0')} <span>/ ${String(reflections.length).padStart(2,'0')}</span>`},220)}}},15000);
render();
if(importedTaskCount)showToast(importedTaskCount+' task'+(importedTaskCount===1?'':'s')+' added to today.');
if(importedPlan.tasks||importedPlan.routines)showToast([importedPlan.tasks?importedPlan.tasks+' scheduled task'+(importedPlan.tasks===1?'':'s'):'',importedPlan.routines?importedPlan.routines+' recurring routine'+(importedPlan.routines===1?'':'s'):''].filter(Boolean).join(' and ')+' added to Orbit.');
})();
